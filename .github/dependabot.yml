# Обновления зависимостей и действий CI (OWASP LLM03, цепочка поставки).
#
# Действия в tests.yml закреплены по SHA — без Dependabot они застыли бы
# навсегда вместе с найденными в них уязвимостями. Python-зависимости —
# по uv.lock; шаг pip-audit в CI говорит, что обновлять срочно.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
