# Прогон тестов на чистой машине при каждом пуше.
#
# Зачем именно здесь: больше половины тестов проекта стерегут ДАННЫЕ,
# а не код. «Не вернулась ли шкура в названия блюд», «даёт ли основное
# блюдо белок», «не попало ли в подбор сырое мясо» — всё это ломается
# не в момент правки кода, а когда кто-то перезапустит скрипт подготовки
# данных и не подумает про тесты. Проверка должна случаться всегда,
# а не когда о ней вспомнили.
#
# Ключи не нужны: провайдер модели подменён заглушкой в tests/conftest.py,
# в сеть тесты не ходят. Каталог блюд и справочник статей лежат
# в репозитории (756 КБ) — без них conftest пропускает больше половины тестов.

name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить зависимости
        # --frozen: замок обязан сойтись с pyproject, иначе падаем здесь,
        # а не в проде на других версиях библиотек.
        run: uv sync --frozen --extra dev

      - name: Линтер
        run: uv run ruff check .

      - name: Тесты
        run: uv run pytest -q

      - name: Проверить, что ничего не пропущено
        # Зелёная галочка не должна означать «половина тестов скипнулась».
        # Такое уже было: без каталога в репозитории проходили 143 теста
        # из 318, а остальные молча пропускались.
        run: |
          uv run pytest -q --no-header -rs 2>&1 | tee /tmp/out.txt
          if grep -q "skipped" /tmp/out.txt; then
            echo "::error::Часть тестов пропущена — проверьте, все ли артефакты на месте"
            exit 1
          fi
