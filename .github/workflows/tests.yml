# Прогон тестов на чистой машине при каждом пуше.
#
# Зачем именно здесь: больше половины тестов проекта стерегут ДАННЫЕ,
# а не код. «Не вернулась ли шкура в названия блюд», «даёт ли основное
# блюдо белок», «не попало ли в подбор сырое мясо» — всё это ломается
# не в момент правки кода, а когда кто-то перезапустит скрипт подготовки
# данных и не подумает про тесты. Проверка должна случаться всегда,
# а не когда о ней вспомнили.
#
# Ключи не нужны: провайдер модели подменён заглушкой в tests/conftest.py,
# в сеть тесты не ходят. Каталог блюд и справочник статей лежат
# в репозитории (756 КБ) — без них conftest пропускает больше половины тестов.

name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Только чтение: тестам писать в репозиторий незачем, и украденный
    # из шага токен ничего не изменит (OWASP LLM03, цепочка поставки).
    permissions:
      contents: read

    steps:
      # Действия закреплены по SHA, а не по тегу: тег в чужом репозитории
      # можно переписать, и в CI молча поедет другой код. Обновляет Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Поставить uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Установить зависимости
        # --frozen: замок обязан сойтись с pyproject, иначе падаем здесь,
        # а не в проде на других версиях библиотек.
        run: uv sync --frozen --extra dev

      - name: Известные уязвимости в зависимостях
        # Проверяется ровно то, что в uv.lock, — и то, что уедет в образ.
        # Первый прогон нашёл 6 уязвимостей (urllib3, certifi, langgraph-sdk).
        run: |
          uv export --frozen --extra dev --no-emit-project --no-hashes -q > /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --disable-pip --no-deps

      - name: Линтер
        run: uv run ruff check .

      - name: Тесты, и ни одного пропуска
        # Зелёная галочка не должна означать «половина тестов скипнулась».
        # Такое уже было: без каталога в репозитории проходили 143 теста
        # из 318, а остальные молча пропускались.
        #
        # Один прогон, а не два (тесты, затем отдельно «нет ли пропусков»):
        # набор идёт ~4 минуты, и двойной прогон подбирался к лимиту в 15.
        # pipefail обязателен: без него tee скрыл бы упавшие тесты.
        run: |
          set -o pipefail
          uv run pytest -q --no-header -rs 2>&1 | tee /tmp/out.txt
          if grep -q "skipped" /tmp/out.txt; then
            echo "::error::Часть тестов пропущена — проверьте, все ли артефакты на месте"
            exit 1
          fi
