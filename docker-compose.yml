# Запуск одной командой из папки проекта:
#
#     docker compose up --build
#
# Интерфейс:    http://localhost:8000
# Документация: http://localhost:8000/docs

services:
  nutrition-agent:
    build:
      context: .
    image: nutrition-agent:latest
    container_name: nutrition-agent

    # Ключи берутся из .env и попадают в контейнер переменными окружения.
    # В слои образа они не запекаются.
    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

    # Контейнеру нужно только читать свои артефакты и ходить в сеть
    # за ответами модели — файловая система остаётся только на чтение.
    read_only: true
    tmpfs:
      - /tmp

    # Журнал чата — единственное, что пишется на диск. Отдельный том:
    # переживает пересоздание контейнера, остальная система остаётся
    # только на чтение. Файлы старше 30 дней сервис удаляет сам.
    # Забрать журналы: docker compose cp nutrition-agent:/app/logs ./logs
    #
    # Хранилище разговоров и меню (SQLite) — свой том: разговоры переживают
    # рестарт и пересоздание контейнера. В нём профили с весом и диагнозами.
    volumes:
      - chat_logs:/app/logs
      - agent_state:/app/state
    environment:
      CHAT_LOG_DIR: /app/logs
      STATE_DB: /app/state/agent.sqlite3
      # За обратным прокси с HTTPS включите — cookie сессии только по TLS:
      # SESSION_COOKIE_SECURE: "true"

    security_opt:
      - no-new-privileges:true

volumes:
  chat_logs:
  agent_state:
